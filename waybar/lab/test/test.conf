output * mode --custom 1920x1200
output * bg #2a2a2a solid_color
default_border pixel 2
client.focused #ff8800 #ff8800 #ffffff #ff8800 #ff8800
bindsym Mod4+d exec WOFI=twofi ~/.config/wofi/menu --show drun --cache-file /dev/null
# The real binding is limited to the real keyboards. This one reaches only test bars.
bindsym --release Super_L exec pkill -USR1 -f '^python3 .*side-bar-test/reveal\.py'
exec bash $SCENARIO
